
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Tournament SM</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #101010;
            color: white;
            text-align: center;
        }

        header {
            background: #181818;
            padding: 20px;
            border-bottom: 2px solid #ff4500;
        }

        h1 {
            color: #ff4500;
        }

        .container {
            padding: 30px 15px;
        }

        .card {
            background: #202020;
            padding: 25px;
            border-radius: 15px;
            margin: 20px auto;
            max-width: 400px;
        }

        button {
            background: #ff4500;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 15px;
        }

        footer {
            padding: 20px;
            color: #999;
        }
    </style>
</head>

<body>

    <header>
        <h1>FF TOURNAMENT SM</h1>
        <p>Free Fire Gaming Tournament</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>Welcome Players!</h2>
            <p>Join our gaming tournament.</p>
            <button onclick="alert('Tournament coming soon!')">
                Join Tournament
            </button>
        </div>

        <div class="card">
            <h2>Upcoming Tournament</h2>
            <p>Stay tuned for tournament updates.</p>
        </div>

    </div>

    <footer>
        <p>© 2026 FF Tournament SM</p>
    </footer>

</body>
</html>
